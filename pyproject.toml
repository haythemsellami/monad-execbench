[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monad-execbench-capture"
version = "0.1.0"
description = "Capture portable execution fixtures for monad-execbench"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["zstandard>=0.23,<1"]

[project.optional-dependencies]
dev = ["ruff>=0.16,<1"]

[project.scripts]
monad-execbench-capture = "monad_execbench_capture.cli:main"

[tool.setuptools]
package-dir = {"" = "capture"}

[tool.setuptools.packages.find]
where = ["capture"]
