[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monad-execbench-capture"
version = "0.1.0"
description = "Capture portable fixtures and report monad-execbench results"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["zstandard>=0.23,<1"]

[project.optional-dependencies]
dev = ["ruff==0.16.6", "build==1.4.0", "twine>=6,<7"]

[project.scripts]
monad-execbench-capture = "monad_execbench_capture.cli:main"
monad-execbench-report = "monad_execbench_report.cli:main"

[tool.setuptools]
packages = ["monad_execbench_capture", "monad_execbench_report"]

[tool.setuptools.package-dir]
monad_execbench_capture = "capture/monad_execbench_capture"
monad_execbench_report = "analysis/monad_execbench_report"

[tool.setuptools.package-data]
monad_execbench_capture = ["pinned-monad.txt", "schema/*.json"]
